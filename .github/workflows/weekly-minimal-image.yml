name: Weekly minimal image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weekly-minimal-image.yml"
      - "image/catalyst/**"
      - "image/live-iso/**"
      - "persist/**"
      - "scripts/tests/test-image-init-selection.sh"
      - "scripts/tests/test-docker-context-policy.sh"
      - "scripts/build-catalyst-squashfs.sh"
      - "scripts/fetch-gentoo-inputs.sh"
      - "scripts/test-qemu-boot.sh"
      - "scripts/test-qemu-boot-docker.sh"
      - "scripts/build-kernel-docker.sh"
      - "scripts/build-initramfs.sh"
      - "scripts/prepare-verity-root-docker.sh"
      - "scripts/prepare-signify-root-docker.sh"
      - "scripts/build-release-disk-docker.sh"
      - "scripts/build-live-iso-docker.sh"
      - "scripts/install-volatoo.sh"
      - "scripts/prepare-secure-boot-test-key-docker.sh"
      - "scripts/package-release-docker.sh"
      - "scripts/require-docker-context.sh"
      - "scripts/publication-container/**"
      - "scripts/tamper-release-efi-docker.sh"
      - "scripts/test-release-disk-docker.sh"
      - "scripts/test-live-iso-docker.sh"
      - "scripts/tests/test-install-volatoo-docker.sh"
      - "scripts/tests/test-firstboot-access-docker.sh"
      - "scripts/tests/test-live-iso-normalizer-docker.sh"
      - "scripts/release-container/**"
      - "scripts/qemu-container/**"
      - "update/**"
  pull_request:
    paths:
      - ".github/workflows/weekly-minimal-image.yml"
      - "image/catalyst/**"
      - "image/live-iso/**"
      - "persist/**"
      - "scripts/tests/test-image-init-selection.sh"
      - "scripts/tests/test-docker-context-policy.sh"
      - "scripts/build-catalyst-squashfs.sh"
      - "scripts/fetch-gentoo-inputs.sh"
      - "scripts/test-qemu-boot.sh"
      - "scripts/test-qemu-boot-docker.sh"
      - "scripts/build-kernel-docker.sh"
      - "scripts/build-initramfs.sh"
      - "scripts/prepare-verity-root-docker.sh"
      - "scripts/prepare-signify-root-docker.sh"
      - "scripts/build-release-disk-docker.sh"
      - "scripts/build-live-iso-docker.sh"
      - "scripts/install-volatoo.sh"
      - "scripts/prepare-secure-boot-test-key-docker.sh"
      - "scripts/package-release-docker.sh"
      - "scripts/require-docker-context.sh"
      - "scripts/publication-container/**"
      - "scripts/tamper-release-efi-docker.sh"
      - "scripts/test-release-disk-docker.sh"
      - "scripts/test-live-iso-docker.sh"
      - "scripts/tests/test-install-volatoo-docker.sh"
      - "scripts/tests/test-firstboot-access-docker.sh"
      - "scripts/tests/test-live-iso-normalizer-docker.sh"
      - "scripts/release-container/**"
      - "scripts/qemu-container/**"
      - "update/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-minimal-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate image pipeline (${{ matrix.init_system }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        init_system:
          - openrc
          - systemd

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check shell sources
        run: |
          shellcheck \
            scripts/build-catalyst-squashfs.sh \
            scripts/fetch-gentoo-inputs.sh \
            scripts/test-qemu-boot.sh \
            scripts/test-qemu-boot-docker.sh \
            scripts/build-kernel-docker.sh \
            scripts/build-initramfs.sh \
            scripts/prepare-verity-root-docker.sh \
            scripts/prepare-signify-root-docker.sh \
            scripts/build-release-disk-docker.sh \
            scripts/build-live-iso-docker.sh \
            scripts/install-volatoo.sh \
            scripts/prepare-secure-boot-test-key-docker.sh \
            scripts/package-release-docker.sh \
            scripts/require-docker-context.sh \
            scripts/tamper-release-efi-docker.sh \
            scripts/test-release-disk-docker.sh \
            scripts/test-live-iso-docker.sh \
            scripts/tests/test-install-volatoo-docker.sh \
            scripts/tests/test-firstboot-access-docker.sh \
            scripts/tests/test-live-iso-normalizer-docker.sh \
            scripts/tests/test-docker-context-policy.sh \
            scripts/tests/test-image-init-selection.sh \
            image/catalyst/finalize.sh \
            image/catalyst/container/run-catalyst.sh \
            image/live-iso/container/build-live-iso.sh \
            scripts/release-container/build-release-disk.sh \
            scripts/publication-container/package-release.sh \
            scripts/qemu-container/test-release-disk.sh \
            scripts/qemu-container/test-live-iso.sh

      - name: Check Python sources
        run: |
          python3 -m py_compile \
            image/live-iso/container/normalize-iso.py \
            image/live-iso/container/verify-inputs.py \
            image/live-iso/tests/test_normalize_iso.py

      - name: Test init-system selection
        run: scripts/tests/test-image-init-selection.sh

      - name: Test Docker context policy
        run: scripts/tests/test-docker-context-policy.sh

      - name: Test live ISO normalization
        run: scripts/tests/test-live-iso-normalizer-docker.sh

      - name: Verify and resolve Gentoo metadata
        run: |
          scripts/fetch-gentoo-inputs.sh \
            --init-system "${{ matrix.init_system }}" \
            --metadata-only \
            "$RUNNER_TEMP/gentoo-inputs-${{ matrix.init_system }}"

      - name: Validate Catalyst builder and spec
        run: |
          scripts/build-catalyst-squashfs.sh \
            --init-system "${{ matrix.init_system }}" \
            --validate-only

  build:
    name: Build minimal image (${{ matrix.init_system }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        init_system:
          - openrc
          - systemd

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified Gentoo inputs
        id: inputs
        run: |
          scripts/fetch-gentoo-inputs.sh \
            --init-system "${{ matrix.init_system }}" \
            "$RUNNER_TEMP/gentoo-inputs-${{ matrix.init_system }}" \
            >>"$GITHUB_OUTPUT"

      - name: Select image version
        id: version
        run: echo "value=$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}" >>"$GITHUB_OUTPUT"

      - name: Build Catalyst minimal image
        env:
          STAGE3_PATH: ${{ steps.inputs.outputs.stage3_path }}
          SNAPSHOT_ID: ${{ steps.inputs.outputs.snapshot_id }}
          SNAPSHOT_PATH: ${{ steps.inputs.outputs.snapshot_path }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          scripts/build-catalyst-squashfs.sh \
            --init-system "${{ matrix.init_system }}" \
            --stage3 "$STAGE3_PATH" \
            --snapshot "$SNAPSHOT_PATH" \
            --snapshot-id "$SNAPSHOT_ID" \
            --version "$VERSION" \
            "out/volatoo-minimal-${{ matrix.init_system }}-${VERSION}.squashfs"

      - name: Write build manifest
        env:
          STAGE3_NAME: ${{ steps.inputs.outputs.stage3_name }}
          STAGE3_SHA512: ${{ steps.inputs.outputs.stage3_sha512 }}
          STAGE3_URL: ${{ steps.inputs.outputs.stage3_url }}
          SNAPSHOT_NAME: ${{ steps.inputs.outputs.snapshot_name }}
          SNAPSHOT_SHA512: ${{ steps.inputs.outputs.snapshot_sha512 }}
          SNAPSHOT_URL: ${{ steps.inputs.outputs.snapshot_url }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          image="out/volatoo-minimal-${{ matrix.init_system }}-${VERSION}.squashfs"
          {
            echo "version=${VERSION}"
            echo "init_system=${{ matrix.init_system }}"
            echo "git_commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "stage3=${STAGE3_NAME}"
            echo "stage3_url=${STAGE3_URL}"
            echo "stage3_sha512=${STAGE3_SHA512}"
            echo "snapshot=${SNAPSHOT_NAME}"
            echo "snapshot_url=${SNAPSHOT_URL}"
            echo "snapshot_sha512=${SNAPSHOT_SHA512}"
            echo "image_sha256=$(awk '{ print $1 }' "${image}.sha256")"
          } >"out/volatoo-minimal-${{ matrix.init_system }}-${VERSION}.build-info"

      - name: Upload image and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: volatoo-minimal-${{ matrix.init_system }}-${{ steps.version.outputs.value }}
          path: |
            out/volatoo-minimal-${{ matrix.init_system }}-${{ steps.version.outputs.value }}.squashfs
            out/volatoo-minimal-${{ matrix.init_system }}-${{ steps.version.outputs.value }}.squashfs.sha256
            out/volatoo-minimal-${{ matrix.init_system }}-${{ steps.version.outputs.value }}.build-info
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  signed-generation-e2e:
    name: Signed realization v3 BIOS/UEFI E2E
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download OpenRC and systemd images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: volatoo-minimal-*
          path: out/images
          merge-multiple: true

      - name: Resolve exact image inputs
        id: images
        run: |
          set -euo pipefail
          for init_system in openrc systemd; do
            mapfile -t matches < <(find out/images -maxdepth 1 -type f \
              -name "volatoo-minimal-${init_system}-*.squashfs" -print | sort)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "expected exactly one ${init_system} SquashFS, found ${#matches[@]}" >&2
              exit 1
            fi
            echo "${init_system}_image=${matches[0]}" >>"$GITHUB_OUTPUT"
          done

      - name: Build the pinned test kernel
        env:
          VOLATOO_BUILD_JOBS: '2'
        run: scripts/build-kernel-docker.sh out/vmlinuz

      - name: Reclaim the kernel build cache
        if: always()
        run: docker volume rm volatoo-kernel-6.18.40 >/dev/null 2>&1 || true

      - name: Prepare an ephemeral realization signing key
        run: |
          set -euo pipefail
          mkdir -p out/signing
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=${PWD}/out/signing,dst=/output" \
            amd64/alpine:3.24.1@sha256:79ff19e9084a00eece421b2523fb93e22d730e2c0e525905de047e848e56d95f \
            sh -c '
              set -eu
              apk add --no-cache busybox-static signify=32-r1 >/dev/null
              cp /bin/busybox.static /output/busybox
              signify -G -n -p /output/realization.pub -s /output/realization.sec
              chmod 0644 /output/busybox /output/realization.pub
              chmod 0600 /output/realization.sec
            '

      - name: Build the trusted initramfs
        run: |
          set -euo pipefail
          scripts/prepare-verity-root-docker.sh out/verity-root
          scripts/prepare-signify-root-docker.sh out/signify-root
          scripts/build-initramfs.sh \
            --busybox out/signing/busybox \
            --verity-root out/verity-root \
            --signify-root out/signify-root \
            --trust-key out/signing/realization.pub \
            --output out/volatoo-initramfs.cpio.gz

      - name: Boot signed v3 and reject tampering
        env:
          VOLATOO_GENERATION_QEMU_CASES: none
          VOLATOO_GENERATION_QEMU_FIRMWARES: bios,uefi
          VOLATOO_GENERATION_QEMU_PAYLOAD_ROOT_MODES: none
          VOLATOO_GENERATION_QEMU_REALIZED: 'yes'
          VOLATOO_GENERATION_QEMU_REALIZATION_VERSION: '3'
          VOLATOO_GENERATION_QEMU_CONTAINER: 'yes'
          VOLATOO_GENERATION_QEMU_VERITY_TAMPER: 'yes'
          VOLATOO_GENERATION_QEMU_SIGNING_KEY: ${{ github.workspace }}/out/signing/realization.sec
          VOLATOO_GENERATION_QEMU_TRUSTED_KEY: ${{ github.workspace }}/out/signing/realization.pub
          VOLATOO_GENERATION_QEMU_PAYLOAD_TIMEOUT: '1200'
          VOLATOO_TEST_TIMEOUT: '1200'
          VOLATOO_VM_MEMORY: 6G
        run: |
          update/tests/test-volatoo-generation-qemu.sh \
            out/vmlinuz \
            out/volatoo-initramfs.cpio.gz \
            "${{ steps.images.outputs.openrc_image }}" \
            "${{ steps.images.outputs.systemd_image }}"
