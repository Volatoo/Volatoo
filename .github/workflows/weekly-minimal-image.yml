name: Weekly minimal image

on:
  push:
    paths:
      - ".github/workflows/weekly-minimal-image.yml"
      - "image/catalyst/**"
      - "persist/**"
      - "scripts/tests/test-image-init-selection.sh"
      - "scripts/build-catalyst-squashfs.sh"
      - "scripts/fetch-gentoo-inputs.sh"
      - "scripts/test-qemu-boot.sh"
  pull_request:
    paths:
      - ".github/workflows/weekly-minimal-image.yml"
      - "image/catalyst/**"
      - "persist/**"
      - "scripts/tests/test-image-init-selection.sh"
      - "scripts/build-catalyst-squashfs.sh"
      - "scripts/fetch-gentoo-inputs.sh"
      - "scripts/test-qemu-boot.sh"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-minimal-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate image pipeline (${{ matrix.init_system }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        init_system:
          - openrc
          - systemd

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check shell sources
        run: |
          shellcheck \
            scripts/build-catalyst-squashfs.sh \
            scripts/fetch-gentoo-inputs.sh \
            scripts/test-qemu-boot.sh \
            scripts/tests/test-image-init-selection.sh \
            image/catalyst/finalize.sh \
            image/catalyst/container/run-catalyst.sh

      - name: Test init-system selection
        run: scripts/tests/test-image-init-selection.sh

      - name: Verify and resolve Gentoo metadata
        run: |
          scripts/fetch-gentoo-inputs.sh \
            --init-system "${{ matrix.init_system }}" \
            --metadata-only \
            "$RUNNER_TEMP/gentoo-inputs-${{ matrix.init_system }}"

      - name: Validate Catalyst builder and spec
        run: |
          scripts/build-catalyst-squashfs.sh \
            --init-system "${{ matrix.init_system }}" \
            --validate-only

  build:
    name: Build minimal image (${{ matrix.init_system }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        init_system:
          - openrc
          - systemd

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download verified Gentoo inputs
        id: inputs
        run: |
          scripts/fetch-gentoo-inputs.sh \
            --init-system "${{ matrix.init_system }}" \
            "$RUNNER_TEMP/gentoo-inputs-${{ matrix.init_system }}" \
            >>"$GITHUB_OUTPUT"

      - name: Select image version
        id: version
        run: echo "value=$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}" >>"$GITHUB_OUTPUT"

      - name: Build Catalyst minimal image
        env:
          STAGE3_PATH: ${{ steps.inputs.outputs.stage3_path }}
          SNAPSHOT_ID: ${{ steps.inputs.outputs.snapshot_id }}
          SNAPSHOT_PATH: ${{ steps.inputs.outputs.snapshot_path }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          scripts/build-catalyst-squashfs.sh \
            --init-system "${{ matrix.init_system }}" \
            --stage3 "$STAGE3_PATH" \
            --snapshot "$SNAPSHOT_PATH" \
            --snapshot-id "$SNAPSHOT_ID" \
            --version "$VERSION" \
            "out/volatoo-minimal-${{ matrix.init_system }}-${VERSION}.squashfs"

      - name: Write build manifest
        env:
          STAGE3_NAME: ${{ steps.inputs.outputs.stage3_name }}
          STAGE3_SHA512: ${{ steps.inputs.outputs.stage3_sha512 }}
          STAGE3_URL: ${{ steps.inputs.outputs.stage3_url }}
          SNAPSHOT_NAME: ${{ steps.inputs.outputs.snapshot_name }}
          SNAPSHOT_SHA512: ${{ steps.inputs.outputs.snapshot_sha512 }}
          SNAPSHOT_URL: ${{ steps.inputs.outputs.snapshot_url }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          image="out/volatoo-minimal-${{ matrix.init_system }}-${VERSION}.squashfs"
          {
            echo "version=${VERSION}"
            echo "init_system=${{ matrix.init_system }}"
            echo "git_commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "stage3=${STAGE3_NAME}"
            echo "stage3_url=${STAGE3_URL}"
            echo "stage3_sha512=${STAGE3_SHA512}"
            echo "snapshot=${SNAPSHOT_NAME}"
            echo "snapshot_url=${SNAPSHOT_URL}"
            echo "snapshot_sha512=${SNAPSHOT_SHA512}"
            echo "image_sha256=$(awk '{ print $1 }' "${image}.sha256")"
          } >"out/volatoo-minimal-${{ matrix.init_system }}-${VERSION}.build-info"

      - name: Upload image and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: volatoo-minimal-${{ matrix.init_system }}-${{ steps.version.outputs.value }}
          path: |
            out/volatoo-minimal-${{ matrix.init_system }}-${{ steps.version.outputs.value }}.squashfs
            out/volatoo-minimal-${{ matrix.init_system }}-${{ steps.version.outputs.value }}.squashfs.sha256
            out/volatoo-minimal-${{ matrix.init_system }}-${{ steps.version.outputs.value }}.build-info
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
