# Configuration embedded in the generated Volatoo initramfs.
# Kernel parameters named volatoo.image, volatoo.image-file,
# volatoo.image-sha256, volatoo.init, volatoo.root, volatoo.tmpfs-size,
# volatoo.state, and volatoo.state-required override these values for a single
# boot.

# A direct block device, LABEL=<filesystem-label>, or UUID=<filesystem-uuid>.
VOLATOO_IMAGE=/dev/vda

# Leave empty for a raw SquashFS device. Set an absolute path when VOLATOO_IMAGE
# identifies a filesystem or ISO containing the SquashFS image.
VOLATOO_IMAGE_FILE=

# Expected lowercase SHA-256 of the raw SquashFS image or SquashFS file. An
# empty value permits booting without verification and emits a warning.
VOLATOO_IMAGE_SHA256=

# The normal Gentoo/OpenRC entry point after switch_root.
VOLATOO_INIT=/sbin/init

# "copy" is the supported Volatoo design. "overlay" remains experimental.
VOLATOO_ROOT_MODE=copy

# Percentage of physical memory available to the root tmpfs.
VOLATOO_TMPFS_SIZE=80%

# Optional persistent state filesystem. "none" disables state discovery.
VOLATOO_STATE=LABEL=VOLATOO-STATE

# "no" continues with a fully volatile boot when state is absent. "yes" waits
# up to ten seconds and treats a missing state filesystem as a boot failure.
VOLATOO_STATE_REQUIRED=no
